services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: berjis
      POSTGRES_DB: berjis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['berjis-pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U berjis -d berjis']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['berjis-redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  berjis-pg:
  berjis-redis:
